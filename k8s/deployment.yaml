apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-config
data:
  OGX_URL: "http://ogx-service:8321"
  GUARDRAILS_URL: "http://nemo-checks-demo:8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ogx-guardrails-demo
  labels:
    app: ogx-guardrails-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ogx-guardrails-demo
  template:
    metadata:
      labels:
        app: ogx-guardrails-demo
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/demo-namespace/ogx-guardrails-demo:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: demo-app-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ogx-guardrails-demo
  labels:
    app: ogx-guardrails-demo
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: ogx-guardrails-demo
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ogx-guardrails-demo
spec:
  to:
    kind: Service
    name: ogx-guardrails-demo
  port:
    targetPort: http
  tls:
    termination: edge
